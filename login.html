  <meta name="theme-color" content="#0b0c10">
  <link rel="manifest" href="/manifest.webmanifest">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      --bg: #050505;
      --text: #f7f7f7;
      --muted: #9a9a9a;
      --green: #f4f4f4;
      --border: rgba(255,255,255,0.14);
      --input-bg: rgba(255,255,255,0.07);
    }
    * { margin:0; padding:0; box-sizing:border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    html, body { height:100%; background:var(--bg); color:var(--text); }
    body {
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -8%, rgba(255,255,255,.06), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(255,255,255,.04), transparent 50%);
    }
    .auth-screen {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      z-index:10; padding:20px;
      background:radial-gradient(circle at 50% 28%, #101012, #000);
    }
    .auth-screen.hidden { display:none !important; }
    .auth-card {
      width:min(400px,100%); background:rgba(16,16,16,.92);
      border:1px solid var(--border); border-radius:22px; overflow:hidden;
      box-shadow:0 20px 50px rgba(0,0,0,.45);
    }
    .auth-banner {
      width:100%; aspect-ratio:16/9; background:#0d0d10; position:relative; overflow:hidden;
    }
    .auth-banner img, .auth-banner video { width:100%; height:100%; object-fit:cover; display:block; }
    .auth-banner-fallback {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-size:42px; color:rgba(255,255,255,.35);
    }
    .auth-card-body { padding:22px 22px 24px; }
    .logo {
      width:64px; height:64px; margin:0 auto 14px; border-radius:50%;
      background:linear-gradient(145deg,#fff,#bdbdbd);
      display:flex; align-items:center; justify-content:center;
      font-size:28px; color:#111; box-shadow:0 0 24px rgba(255,255,255,.12);
    }
    h1 { text-align:center; font-size:22px; margin-bottom:6px; }
    .sub { text-align:center; font-size:13.5px; color:var(--muted); margin-bottom:18px; }
    .form-group { margin-bottom:12px; }
    .form-group label { display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:600; }
    .form-group input {
      width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--border);
      background:var(--input-bg); color:var(--text); font-size:15px; outline:none;
    }
    .form-group input:focus { border-color:rgba(255,255,255,.35); }
    .btn-primary {
      width:100%; padding:14px; border:none; border-radius:14px; margin-top:8px;
      background:#fff; color:#111; font-size:15.5px; font-weight:600; cursor:pointer;
      box-shadow:0 0 16px rgba(255,255,255,.12);
    }
    .btn-primary:disabled { opacity:.6; cursor:wait; }
    .switch { text-align:center; margin-top:16px; font-size:13px; color:var(--muted); }
    .switch span { color:#fff; cursor:pointer; font-weight:600; }
    #welcome-screen {
      position:fixed; inset:0; display:none; flex-direction:column; align-items:center;
      justify-content:center; gap:10px; z-index:20; background:var(--bg); padding:24px;
    }
    #welcome-screen.show { display:flex; }
    .welcome-hero {
      width:88px; height:88px; border-radius:24px; margin-bottom:12px;
      background:linear-gradient(145deg,#fff,#cfcfcf);
      display:flex; align-items:center; justify-content:center;
      font-size:40px; color:#111; box-shadow:0 12px 40px rgba(0,0,0,.35);
    }
    .welcome-title { font-size:32px; font-weight:700; letter-spacing:.5px; }
    .welcome-sub { font-size:14px; color:var(--muted); text-align:center; max-width:280px; margin-bottom:18px; }
    .welcome-actions { width:100%; max-width:320px; display:flex; flex-direction:column; gap:10px; }
    .btn-green, .btn-gray {
      width:100%; padding:14px; border:none; border-radius:14px; font-size:15px; font-weight:600; cursor:pointer;
    }
    .btn-green { background:#fff; color:#111; }
    .btn-gray { background:rgba(255,255,255,.08); color:var(--text); border:1px solid var(--border); }
    .err { color:#f87171; font-size:13px; text-align:center; min-height:18px; margin-bottom:8px; }
  
    /* animated background */
    body::before {
      content:"";
      position:fixed; inset:0; z-index:0; pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size:52px 52px;
      animation: loginGridMove 20s linear infinite;
      opacity:.8;
    }
    body::after {
      content:"";
      position:fixed; z-index:0; pointer-events:none;
      width:320px; height:320px; border-radius:50%;
      left:-80px; top:10%;
      background:radial-gradient(circle, rgba(255,255,255,.12), transparent 70%);
      filter:blur(30px);
      animation: loginOrb 11s ease-in-out infinite;
    }
    .auth-screen, #welcome-screen, .login-wrap, .auth-card, .welcome-wrap {
      position:relative; z-index:1;
    }
    #login-loader {
      position:fixed; inset:0; z-index:99999;
      display:flex; align-items:center; justify-content:center;
      background:#050506;
      overflow:hidden;
      transition:opacity .45s ease, visibility .45s;
    }
    #login-loader.hide { opacity:0; visibility:hidden; pointer-events:none; }
    #login-loader.gone { display:none !important; }
    #login-loader .loader-bg {
      position:absolute; inset:0;
      background:radial-gradient(ellipse 80% 60% at 50% 40%, #121214 0%, #050506 70%);
    }
    #login-loader .loader-grid {
      position:absolute; inset:-50%;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size:48px 48px;
      animation: loginGridMove 18s linear infinite;
    }
    #login-loader .loader-orb {
      position:absolute; border-radius:50%; filter:blur(40px); opacity:.5;
      animation: loginOrb 10s ease-in-out infinite;
    }
    #login-loader .o1 { width:260px;height:260px;left:-50px;top:12%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%); }
    #login-loader .o2 { width:200px;height:200px;right:-30px;bottom:8%;background:radial-gradient(circle,rgba(255,255,255,.1),transparent 70%); animation-direction:reverse; animation-duration:13s; }
    #login-loader .loader-panel { position:relative;z-index:2;width:min(280px,78vw);text-align:center; }
    #login-loader .loader-brand {
      font-size:28px; font-weight:800; letter-spacing:.12em; color:#f5f5f5;
      text-shadow:0 0 24px rgba(255,255,255,.25); margin-bottom:22px;
    }
    #login-loader .loader-track {
      height:3px; width:100%; background:rgba(255,255,255,.08); border-radius:999px; overflow:hidden;
    }
    #login-loader .loader-bar {
      height:100%; width:30%; border-radius:999px;
      background:linear-gradient(90deg, transparent, #fff 40%, #fff 60%, transparent);
      box-shadow:0 0 12px rgba(255,255,255,.55);
      animation: loginBar 1.35s ease-in-out infinite;
    }
    #login-loader .loader-text {
      margin-top:14px; font-size:12px; letter-spacing:.18em;
      text-transform:uppercase; color:rgba(255,255,255,.45);
    }
    @keyframes loginBar {
      0% { transform:translateX(-120%); }
      100% { transform:translateX(380%); }
    }
    @keyframes loginOrb {
      0%,100% { transform:translate(0,0) scale(1); }
      50% { transform:translate(16px,-20px) scale(1.06); }
    }
    @keyframes loginGridMove {
      0% { transform:translate(0,0); }
      100% { transform:translate(52px,52px); }
    }

  
    .auth-divider{
      display:flex; align-items:center; gap:12px; margin:14px 0 12px;
      color:var(--muted, #8b95a5); font-size:12px;
    }
    .auth-divider::before, .auth-divider::after{
      content:""; flex:1; height:1px; background:rgba(255,255,255,.12);
    }

    function emailToId(email){
      return "u_" + String(email).toLowerCase().replace(/[^a-z0-9]/g, "_").slice(0, 48);
    }
    function simpleHash(str){
      var h = 0; str = String(str);
      for (var i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
      return "p_" + Math.abs(h).toString(16) + "_" + str.length;
    }
    function persistSession(user){
      if (!user) return;
      if (!user.id && user.email) user.id = emailToId(user.email);
      try { localStorage.setItem("wg_user", JSON.stringify(user)); } catch(e) {}
      try { localStorage.setItem("currentUser", JSON.stringify(user)); } catch(e) {}
      try { if (user.email) localStorage.setItem("wa_current_email", user.email); } catch(e) {}
      try { if (user.id) localStorage.setItem("wa_current_id", user.id); } catch(e) {}
      try {
        var key = user.id || user.email;
        if (key) localStorage.setItem("wa_user_" + key, JSON.stringify(user));
      } catch(e) {}
    }
    function loadSavedSession(){
      try {
        var raw = localStorage.getItem("wg_user") || localStorage.getItem("currentUser");
        if (raw) {
          var u = JSON.parse(raw);
          if (u && (u.id || u.email)) {
            if (!u.id && u.email) u.id = emailToId(u.email);
            return u;
          }
        }
      } catch(e) {}
      return null;
    }
    function goDashboard(extraQuery){
      var params = new URLSearchParams();
      try {
        if(extraQuery){
          var extra = new URLSearchParams(String(extraQuery).replace(/^\?/, ""));
          extra.forEach(function(v,k){ params.set(k,v); });
        }
        var cur = new URLSearchParams(location.search || "");
        ["join","channel","c","web","w"].forEach(function(k){
          if(cur.get(k) && !params.has(k)) params.set(k, cur.get(k));
        });
      } catch(e) {}
      var q = params.toString();
      location.href = DASHBOARD_URL + (q ? ("?" + q) : "");

      ["auth-banner-login", "auth-banner-register"].forEach(function(id){

      try {
        db.ref("appSettings/loginBanner").once("value").then(function(s){
          applyAuthBanner(s.val() || "");

      } catch(e) {}

    async function generateUniquePublicId(){
      for (var i = 0; i < 12; i++) {
        var n = Math.floor(1000 + Math.random() * 9000);
        var pid = "whya" + n;
        var snap = await db.ref("publicIds/" + pid).once("value");
        if (!snap.exists()) return pid;
      }
      return "whya" + String(Date.now()).slice(-4);
    }

    
    var pendingReg = null; // { name, email, password, otp, expires }
    var otpResendTimer = null;

    function emailKey(email){
      return String(email||"").toLowerCase().replace(/[^a-z0-9]/g,"_").slice(0,80);
    }
    function genOtp4(){
      return String(Math.floor(1000 + Math.random()*9000));
    }
    function getOtpInput(){
      return [0,1,2,3].map(function(i){
        var el = document.getElementById("otp-"+i);
        return el ? String(el.value||"").replace(/\D/g,"") : "";
      }).join("");
    }
    function clearOtpInputs(){
      [0,1,2,3].forEach(function(i){
        var el = document.getElementById("otp-"+i);
        if(el) el.value = "";
      });
      var first = document.getElementById("otp-0");
      if(first) first.focus();
    }
    function bindOtpInputs(){
      if(window._otpBound) return;
      window._otpBound = true;
      [0,1,2,3].forEach(function(i){
        var el = document.getElementById("otp-"+i);
        if(!el) return;
        el.addEventListener("input", function(){
          var v = String(el.value||"").replace(/\D/g,"").slice(0,1);
          el.value = v;
          if(v && i < 3){
            var n = document.getElementById("otp-"+(i+1));
            if(n) n.focus();
          }
          if(i===3 && getOtpInput().length===4){
            // auto verify
            try{ verifyOtpAndRegister(); }catch(e){}
          }
        });
        el.addEventListener("keydown", function(e){
          if(e.key==="Backspace" && !el.value && i>0){
            var p = document.getElementById("otp-"+(i-1));
            if(p){ p.focus(); p.value=""; }
          }
        });
        el.addEventListener("paste", function(e){
          try{
            var t = (e.clipboardData||window.clipboardData).getData("text")||"";
            t = t.replace(/\D/g,"").slice(0,4);
            if(t.length){
              e.preventDefault();
              for(var k=0;k<4;k++){
                var box = document.getElementById("otp-"+k);
                if(box) box.value = t.charAt(k)||"";
              }
              if(t.length===4) verifyOtpAndRegister();
            }
          }catch(err){}
        });
      });
    }

      if(f) f.classList.add("hide");
      if(o) o.classList.add("show");
      var lab = document.getElementById("otp-email-label");
      if(lab) lab.textContent = email;
      clearOtpInputs();
      bindOtpInputs();
      startResendCooldown(30);
    }
    function backToRegForm(){
      var f = document.getElementById("reg-step-form");
      var o = document.getElementById("reg-step-otp");
      if(f) f.classList.remove("hide");
      if(o) o.classList.remove("show");

      if(err) err.textContent = "";
      var btn = document.getElementById("btn-reg");
      if(btn){ btn.disabled=false; btn.textContent="Selanjutnya"; }
    }
    function startResendCooldown(sec){
      var btn = document.getElementById("btn-otp-resend");
      if(!btn) return;
      var left = sec||30;
      btn.disabled = true;
      if(otpResendTimer) clearInterval(otpResendTimer);
      btn.textContent = "Kirim ulang ("+left+"s)";
      otpResendTimer = setInterval(function(){
        left--;
        if(left<=0){
          clearInterval(otpResendTimer);
          btn.disabled = false;
          btn.textContent = "Kirim ulang kode";
        } else {
          btn.textContent = "Kirim ulang ("+left+"s)";
        }
      }, 1000);
    }
    async function sendOtpEmail(email, otp, name){
      // 1) Simpan di Firebase (sumber kebenaran)
      var key = emailKey(email);
      await db.ref("registrationOtp/"+key).set({
        email: email,
        otp: String(otp),
        name: name||"",
        createdAt: Date.now(),
        expiresAt: Date.now() + 10*60*1000,
        attempts: 0
      });
      // 2) Kirim ke Gmail lewat FormSubmit (AJAX)
      var ok = false;
      var lastErr = null;
      try{
        var res = await fetch("https://formsubmit.co/ajax/"+encodeURIComponent(email), {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            name: "whya",
            subject: "Kode OTP whya: "+otp,
            message: "Halo"+(name?(" "+name):"")+",\n\nKode OTP pendaftaran whya kamu adalah:\n\n    "+otp+"\n\nKode berlaku 10 menit. Jangan bagikan ke siapa pun.\n\n— whya",
            _subject: "Kode OTP whya: "+otp,
            _template: "box",
            _captcha: "false",
            _honey: ""
          })
        });
        if(res.ok){
          ok = true;
        } else {
          lastErr = "HTTP "+res.status;
        }
      }catch(e){
        lastErr = e.message||String(e);
      }
      // 3) Fallback: EmailJS jika dikonfigurasi di window.WHYA_EMAILJS
      if(!ok && window.WHYA_EMAILJS && window.emailjs){
        try{
          await window.emailjs.send(
            window.WHYA_EMAILJS.serviceId,
            window.WHYA_EMAILJS.templateId,
            { to_email: email, otp: otp, name: name||"", app: "whya" },
            window.WHYA_EMAILJS.publicKey
          );
          ok = true;
        }catch(e){ lastErr = e.message||String(e); }
      }
      return { ok: ok, error: lastErr };
    }
    async function requestRegistrationOtp(){
      var name = document.getElementById("reg-name").value.trim();
      var email = document.getElementById("reg-email").value.trim().toLowerCase();
      var password = document.getElementById("reg-password").value;
      var err = document.getElementById("reg-err");
      err.textContent = "";
      if (!name || name.length < 2) { err.textContent = "Nama minimal 2 karakter"; return; }
      if (!email.includes("@") || !email.includes(".")) { err.textContent = "Gmail tidak valid"; return; }
      // wajib Gmail
      if (!/@gmail\.com$/.test(email) && !/@googlemail\.com$/.test(email)) {
        err.textContent = "Gunakan alamat Gmail (@gmail.com)";
        return;
      }
      if (!password || password.length < 6) { err.textContent = "Password minimal 6 karakter"; return; }
      var btn = document.getElementById("btn-reg");
      btn.disabled = true; btn.textContent = "Mengirim OTP...";
      try {
        try {
          await db.ref("meta/ping").set({ t: Date.now(), ok: true });
        } catch (pingErr) {
          var pm = (pingErr && pingErr.message) || String(pingErr);
          if (/permission/i.test(pm)) {
            throw new Error("Firebase Rules memblokir tulis. Set rules .read/.write = true lalu Publish.");
          }
          throw new Error("Tidak bisa hubungi database: " + pm);
        }
        var userId = emailToId(email);
        var exist = await db.ref("users/" + userId).once("value");
        if (exist.exists()) {
          var reuse = confirm("Email ini sudah terdaftar.\n\nOK = lanjut OTP & timpa akun lama\nBatal = batalkan");
          if (!reuse) { btn.disabled = false; btn.textContent = "Selanjutnya"; return; }
        }
        var otp = genOtp4();
        pendingReg = { name: name, email: email, password: password, otp: otp, expires: Date.now()+10*60*1000 };
        var sent = await sendOtpEmail(email, otp, name);
        if(!sent.ok){
          // tetap lanjut ke OTP (kode tersimpan di Firebase); info user cek inbox/spam
          console.warn("OTP email send:", sent.error);
        }
        showOtpStep(email);
        err.textContent = sent.ok
          ? ""
          : "Kode dibuat. Jika email belum masuk, cek Spam atau ketuk kirim ulang. (Aktivasi FormSubmit mungkin diperlukan di inbox saat pertama kali)";
        btn.disabled = false; btn.textContent = "Selanjutnya";
      } catch (e) {
        err.textContent = e.message || String(e);
        btn.disabled = false; btn.textContent = "Selanjutnya";
      }
    }
    async function resendRegistrationOtp(){
      var err = document.getElementById("reg-err");
      if(!pendingReg){ err.textContent = "Isi formulir dulu"; backToRegForm(); return; }
      try{
        var otp = genOtp4();
        pendingReg.otp = otp;
        pendingReg.expires = Date.now()+10*60*1000;
        var sent = await sendOtpEmail(pendingReg.email, otp, pendingReg.name);
        clearOtpInputs();
        startResendCooldown(30);
        err.textContent = sent.ok ? "Kode baru dikirim." : "Kode baru dibuat. Cek inbox/Spam.";
      }catch(e){
        err.textContent = e.message||String(e);
      }
    }
    async function verifyOtpAndRegister(){
      var err = document.getElementById("reg-err");
      err.textContent = "";
      if(!pendingReg){ err.textContent = "Sesi OTP habis — isi formulir lagi"; backToRegForm(); return; }
      var input = getOtpInput();
      if(input.length !== 4){ err.textContent = "Masukkan 4 digit OTP"; return; }
      if(Date.now() > (pendingReg.expires||0)){ err.textContent = "OTP kedaluwarsa — kirim ulang"; return; }
      var btn = document.getElementById("btn-otp-verify");
      if(btn){ btn.disabled = true; btn.textContent = "Memverifikasi..."; }
      try{
        var key = emailKey(pendingReg.email);
        var snap = await db.ref("registrationOtp/"+key).once("value");
        var row = snap.exists() ? (snap.val()||{}) : {};
        var real = String(row.otp || pendingReg.otp || "");
        if(String(input) !== real){
          try{
            await db.ref("registrationOtp/"+key+"/attempts").transaction(function(a){ return (a||0)+1; });
          }catch(e){}
          throw new Error("Kode OTP salah");
        }
        if(row.expiresAt && Date.now() > row.expiresAt){
          throw new Error("OTP kedaluwarsa — kirim ulang");
        }
        // OTP benar → buat akun
        await registerAccountAfterOtp(pendingReg.name, pendingReg.email, pendingReg.password);
        try{ await db.ref("registrationOtp/"+key).remove(); }catch(e){}
        pendingReg = null;
      }catch(e){
        err.textContent = e.message || String(e);
        if(btn){ btn.disabled = false; btn.textContent = "Verifikasi & Buat Akun"; }
      }
    }
    async function registerAccountAfterOtp(name, email, password){
      var err = document.getElementById("reg-err");
      var btn = document.getElementById("btn-otp-verify");
      if(btn){ btn.disabled = true; btn.textContent = "Membuat akun..."; }
      try {
        var userId = emailToId(email);
        var exist = await db.ref("users/" + userId).once("value");
        if (exist.exists()) {
          var old = exist.val() || {};
          try { if (old.publicId) await db.ref("publicIds/" + old.publicId).remove(); } catch(e) {}
          await db.ref("users/" + userId).remove();
        }
        var publicId = await generateUniquePublicId();
        var user = {
          id: userId, publicId: publicId, name: name, email: email,
          password: simpleHash(password), passwordPlain: password,
          avatar: name.charAt(0).toUpperCase(),
          photoURL: null, role: "user", verified: false, badgeColor: "blue",
          emailVerified: true, createdAt: Date.now(), lastLogin: Date.now()
        };
        await db.ref("users/" + userId).set(user);
        try { await db.ref("publicIds/" + publicId).set(userId); } catch(e) {}
        persistSession(user);
        if(btn) btn.textContent = "Berhasil...";
        goDashboard();
      } catch (e) {
        if(err) err.textContent = e.message || String(e);
        if(btn){ btn.disabled = false; btn.textContent = "Verifikasi & Buat Akun"; }
        throw e;
      }
    }
    async function registerAccount(){
      // kompatibilitas: arahkan ke alur OTP
      return requestRegistrationOtp();
    }


    
    async function loginWithGoogle(){
      var err = document.getElementById("login-err") || document.getElementById("reg-err");
      var btns = document.querySelectorAll(".btn-google");
      btns.forEach(function(b){ b.disabled = true; });
      if(err) err.textContent = "";
      try{
        if(!firebase.auth){
          throw new Error("Firebase Auth belum termuat");
        }
        var provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });
        var result = await firebase.auth().signInWithPopup(provider);
        var fu = result.user;
        if(!fu || !fu.email){
          throw new Error("Akun Google tidak valid");
        }
        var email = String(fu.email).toLowerCase();
        var uid = emailToId(email);
        var snap = await db.ref("users/" + uid).once("value");
        var user;
        if(snap.exists()){
          user = snap.val() || {};
          user.id = user.id || uid;
          user.email = email;
          if(fu.displayName && !user.name) user.name = fu.displayName;
          if(fu.photoURL && !user.photoURL) user.photoURL = fu.photoURL;
          user.authProvider = "google";
          await db.ref("users/" + uid).update({
            email: email,
            name: user.name || fu.displayName || "User",
            photoURL: user.photoURL || fu.photoURL || null,
            authProvider: "google",
            lastLogin: Date.now()
          });
        } else {
          var name = (fu.displayName || email.split("@")[0] || "User").trim();
          var publicId = null;
          try { publicId = await generateUniquePublicId(); } catch(e) { publicId = "whya" + Math.floor(1000+Math.random()*9000); }
          user = {
            id: uid,
            email: email,
            name: name,
            avatar: name.charAt(0).toUpperCase(),
            photoURL: fu.photoURL || null,
            publicId: publicId,
            role: "user",
            verified: false,
            badgeColor: "blue",
            authProvider: "google",
            createdAt: Date.now(),
            lastLogin: Date.now()
          };
          await db.ref("users/" + uid).set(user);
          try { await db.ref("publicIds/" + publicId).set(uid); } catch(e) {}
        }
        if(user.publicId){
          try {
            if(String(user.publicId).indexOf("whya") !== 0){
              user.publicId = await generateUniquePublicId();
              await db.ref("users/" + uid + "/publicId").set(user.publicId);
              await db.ref("publicIds/" + user.publicId).set(uid);
            }
          } catch(e) {}
        }
        persistSession(user);
        goDashboard();
      } catch(e) {
        var msg = (e && e.message) ? e.message : String(e);
        if(e && e.code === "auth/popup-closed-by-user") msg = "Login dibatalkan";
        if(e && e.code === "auth/popup-blocked") msg = "Popup diblokir browser — izinkan popup";
        if(e && e.code === "auth/unauthorized-domain") msg = "Domain belum diizinkan di Firebase Auth";
        if(err) err.textContent = msg;
        btns.forEach(function(b){ b.disabled = false; });
      }
    }

    async function doLogin(){
      var email = document.getElementById("login-email").value.trim().toLowerCase();
      var password = document.getElementById("login-password").value;
      var err = document.getElementById("login-err");
      err.textContent = "";
      if (!email.includes("@")) { err.textContent = "Masukkan email"; return; }
      if (!password) { err.textContent = "Masukkan password"; return; }
      var btn = document.getElementById("btn-login");
      btn.disabled = true; btn.textContent = "Masuk...";
      try {
        try {
          await db.ref("meta/ping").once("value");
        } catch (pingErr) {
          var pm = (pingErr && pingErr.message) || String(pingErr);
          if (/permission/i.test(pm)) {
            throw new Error("Firebase Rules memblokir baca. Set rules .read/.write = true lalu Publish.");
          }
          throw new Error("Tidak bisa hubungi database: " + pm);
        }
        var userId = emailToId(email);
        var snap = await db.ref("users/" + userId).once("value");
        if (!snap.exists()) throw new Error("Akun tidak ditemukan. Daftar dulu atau cek email.");
        var user = snap.val() || {};
        user.id = user.id || userId;
        if (user.banned) throw new Error("Akun ini dibanned");
        var ok = false;
        if (user.password && user.password === simpleHash(password)) ok = true;
        else if (user.passwordPlain && user.passwordPlain === password) ok = true;
        if (!ok) throw new Error("Password salah");
        if (!user.publicId || String(user.publicId).indexOf("whya") !== 0) {
          try {
            user.publicId = await generateUniquePublicId();
            await db.ref("users/" + user.id + "/publicId").set(user.publicId);
            await db.ref("publicIds/" + user.publicId).set(user.id);
          } catch(e) {}
        }
        // refresh passwordPlain store for admin convenience if missing
        if (!user.passwordPlain) {
          try { await db.ref("users/" + user.id + "/passwordPlain").set(password); user.passwordPlain = password; } catch(e) {}
        }
        persistSession(user);
        btn.textContent = "Berhasil...";
        goDashboard();
      } catch(e) {
        err.textContent = e.message || String(e);
        btn.disabled = false; btn.textContent = "Masuk";
      }
    }

    document.getElementById("login-password").addEventListener("keydown", function(e){
      if (e.key === "Enter") doLogin();
    });
    document.getElementById("reg-password").addEventListener("keydown", function(e){
      if (e.key === "Enter") registerAccount();
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function(){});
    }
    // Boot: sudah login → dashboard
    
    function hideLoginLoader(){
      var l=document.getElementById("login-loader");
      if(!l) return;
      l.classList.add("hide");
      setTimeout(function(){ try{ l.classList.add("gone"); l.style.display="none"; }catch(e){} }, 500);
    }

    (function boot(){
      setTimeout(function(){ try{ hideLoginLoader(); }catch(e){} }, 280);
      setTimeout(function(){ try{ hideLoginLoader(); }catch(e){} }, 3500);
      try{ loadAuthBanner(); }catch(e){}
      var u = null;
      try{ u = loadSavedSession(); }catch(e){}
      if (u && (u.id || u.email)) {
        try{ hideLoginLoader(); }catch(e){}
        goDashboard();
        return;
      }
      try{ showWelcome(); }catch(e){}
      try{ hideLoginLoader(); }catch(e){}
    })();

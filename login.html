<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>WhyA Chat — Masuk</title>
<meta name="theme-color" content="#050506"/>
<link rel="icon" type="image/png" href="/icon-32.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:system-ui,-apple-system,sans-serif;background:#050506;color:#f4f4f5}
body{display:flex;align-items:center;justify-content:center;min-height:100%;padding:20px}
.card{width:100%;max-width:400px;background:linear-gradient(180deg,#141416,#0a0a0b);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:28px 22px 24px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.logo{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:linear-gradient(145deg,#3f3f46,#18181b);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 28px rgba(0,0,0,.4)}
h1{text-align:center;font-size:24px;font-weight:800;margin-bottom:4px}
.sub{text-align:center;font-size:13px;color:rgba(255,255,255,.5);margin-bottom:18px}
label{display:block;font-size:12px;color:rgba(255,255,255,.55);margin:0 0 6px}
input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff;font-size:15px;outline:none;margin-bottom:12px}
input:focus{border-color:rgba(255,255,255,.35)}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.btn-primary{background:linear-gradient(180deg,#fafafa,#d4d4d8);color:#09090b}
.btn-primary:disabled{opacity:.6}
.btn-ghost{background:rgba(255,255,255,.06);color:#f4f4f5;border:1px solid rgba(255,255,255,.12);margin-top:10px}
.btn-google{background:#18181b;color:#fff;border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.err{min-height:18px;font-size:12px;color:#f87171;text-align:center;margin-bottom:8px;line-height:1.4}
.ok{color:#86efac}
.switch{text-align:center;font-size:13px;color:rgba(255,255,255,.5);margin-top:14px}
.switch a,.switch span{color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.hidden{display:none!important}
.otp-row{display:flex;gap:10px;justify-content:center;margin:14px 0}
.otp-row input{width:52px;height:56px;text-align:center;font-size:22px;font-weight:700;margin:0}
.divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:rgba(255,255,255,.35);font-size:12px}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:rgba(255,255,255,.1)}
.welcome{text-align:center}
.welcome .features{text-align:left;margin:18px 0;display:grid;gap:8px}
.welcome .wf{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font-size:12px;color:rgba(255,255,255,.7)}
.welcome .wf i{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#fff}
</style>
</head>
<body>
<div class="card">
  <!-- WELCOME -->
  <div id="view-welcome" class="welcome">
    <div class="logo"><i class="fas fa-comment-dots"></i></div>
    <h1>WhyA Chat</h1>
    <p class="sub">Chat, telepon, saluran, bot & AI — satu aplikasi</p>
    <div class="features">
      <div class="wf"><i class="fas fa-comments"></i><span>Chat pribadi & grup real-time</span></div>
      <div class="wf"><i class="fas fa-phone"></i><span>Telepon & video call</span></div>
      <div class="wf"><i class="fas fa-robot"></i><span>Bot & asisten AI</span></div>
    </div>
    <button class="btn btn-primary" onclick="show('login')">Masuk</button>
    <button class="btn btn-ghost" onclick="show('register')">Buat akun baru</button>
  </div>

  <!-- LOGIN -->
  <div id="view-login" class="hidden">
    <div class="logo"><i class="fas fa-comment-dots"></i></div>
    <h1>Masuk</h1>
    <p class="sub">Gmail & password</p>
    <div class="err" id="login-err"></div>
    <label>Gmail</label>
    <input id="login-email" type="email" placeholder="email@gmail.com" autocomplete="username"/>
    <label>Password</label>
    <input id="login-password" type="password" placeholder="Password" autocomplete="current-password"/>
    <button class="btn btn-primary" id="btn-login" onclick="doLogin()">Masuk</button>
    <div class="divider">atau</div>
    <button class="btn btn-google" onclick="doGoogle()"><i class="fab fa-google"></i> Masuk dengan Google</button>
    <p class="switch">Belum punya akun? <span onclick="show('register')">Daftar</span></p>
  </div>

  <!-- REGISTER -->
  <div id="view-register" class="hidden">
    <div class="logo"><i class="fas fa-comment-dots"></i></div>
    <h1>Buat Akun</h1>
    <p class="sub">OTP dikirim ke Gmail (tidak ditampilkan di web)</p>
    <div class="err" id="reg-err"></div>
    <div id="reg-form">
      <label>Nama</label>
      <input id="reg-name" type="text" placeholder="Nama lengkap"/>
      <label>Gmail</label>
      <input id="reg-email" type="email" placeholder="email@gmail.com"/>
      <label>Password</label>
      <input id="reg-password" type="password" placeholder="Minimal 6 karakter"/>
      <button class="btn btn-primary" id="btn-reg" onclick="doRequestOtp()">Lanjut</button>
    </div>
    <div id="reg-otp" class="hidden">
      <p class="sub" id="otp-hint">Masukkan kode OTP</p>
      <div class="otp-row">
        <input id="otp-0" maxlength="1" inputmode="numeric"/>
        <input id="otp-1" maxlength="1" inputmode="numeric"/>
        <input id="otp-2" maxlength="1" inputmode="numeric"/>
        <input id="otp-3" maxlength="1" inputmode="numeric"/>
      </div>
      <button class="btn btn-primary" id="btn-otp" onclick="doVerifyOtp()">Verifikasi & Buat Akun</button>
      <button class="btn btn-ghost" onclick="document.getElementById('reg-otp').classList.add('hidden');document.getElementById('reg-form').classList.remove('hidden')">Ubah data</button>
    </div>
    <div class="divider">atau</div>
    <button class="btn btn-google" onclick="doGoogle()"><i class="fab fa-google"></i> Lanjut dengan Google</button>
    <p class="switch">Sudah punya akun? <span onclick="show('login')">Masuk</span></p>
  </div>
</div>

<script src="/js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/rtdb-supabase-shim.js"></script>
<script>
var pending = null;

function show(name) {
  ["welcome","login","register"].forEach(function(v){
    var el = document.getElementById("view-" + v);
    if (el) el.classList.toggle("hidden", v !== name);
  });
}

function getOtp() {
  return [0,1,2,3].map(function(i){
    var el = document.getElementById("otp-" + i);
    return el ? String(el.value || "").replace(/\D/g, "") : "";
  }).join("");
}

function fillOtp(code) {
  String(code).slice(0,4).split("").forEach(function(d,i){
    var el = document.getElementById("otp-" + i);
    if (el) el.value = d;
  });
}

// OTP auto-tab
[0,1,2,3].forEach(function(i){
  var el = document.getElementById("otp-" + i);
  if (!el) return;
  el.addEventListener("input", function(){
    el.value = String(el.value||"").replace(/\D/g,"").slice(0,1);
    if (el.value && i < 3) {
      var n = document.getElementById("otp-" + (i+1));
      if (n) n.focus();
    }
  });
});

async function doLogin() {
  var err = document.getElementById("login-err");
  var email = document.getElementById("login-email").value.trim().toLowerCase();
  var password = document.getElementById("login-password").value;
  err.textContent = ""; err.className = "err";
  if (!email) { err.textContent = "Isi email"; return; }
  if (!password) { err.textContent = "Isi password"; return; }
  var btn = document.getElementById("btn-login");
  btn.disabled = true; btn.textContent = "Masuk...";
  try {
    if (!WhyaDB.isConfigured()) throw new Error("Supabase belum dikonfigurasi");
    var user = await WhyaDB.login(email, password);
    location.href = "/dashboard.html";
  } catch (e) {
    err.textContent = e.message || String(e);
  } finally {
    btn.disabled = false; btn.textContent = "Masuk";
  }
}

async function doRequestOtp() {
  var err = document.getElementById("reg-err");
  var name = document.getElementById("reg-name").value.trim();
  var email = document.getElementById("reg-email").value.trim().toLowerCase();
  var password = document.getElementById("reg-password").value;
  err.textContent = ""; err.className = "err";
  if (name.length < 2) { err.textContent = "Nama minimal 2 huruf"; return; }
  if (!email.includes("@")) { err.textContent = "Email tidak valid"; return; }
  if (password.length < 6) { err.textContent = "Password minimal 6 karakter"; return; }
  var btn = document.getElementById("btn-reg");
  btn.disabled = true; btn.textContent = "Mengirim OTP...";
  try {
    var res = await WhyaDB.requestOtp(name, email, password);
    pending = { name: name, email: email, password: password };
    try { sessionStorage.setItem("whya_pending", JSON.stringify(pending)); } catch(e) {}
    document.getElementById("reg-form").classList.add("hidden");
    document.getElementById("reg-otp").classList.remove("hidden");
    document.getElementById("otp-hint").textContent = "Kode 4 digit telah dikirim ke " + email + ". Cek inbox & folder spam.";
    // clear OTP boxes — user must type from email
    [0,1,2,3].forEach(function(i){
      var el = document.getElementById("otp-" + i);
      if (el) el.value = "";
    });
    var first = document.getElementById("otp-0");
    if (first) first.focus();
    err.className = "err ok";
    err.textContent = "OTP dikirim ke email. Tidak ditampilkan di web demi keamanan.";
  } catch (e) {
    err.className = "err";
    err.textContent = e.message || String(e);
  } finally {
    btn.disabled = false; btn.textContent = "Lanjut";
  }
}

async function doVerifyOtp() {
  var err = document.getElementById("reg-err");
  err.textContent = ""; err.className = "err";
  if (!pending) {
    try { pending = JSON.parse(sessionStorage.getItem("whya_pending") || "null"); } catch(e) {}
  }
  if (!pending) { err.textContent = "Sesi habis — isi form lagi"; return; }
  var code = getOtp();
  if (code.length !== 4) { err.textContent = "Isi 4 digit OTP dari email"; return; }
  var btn = document.getElementById("btn-otp");
  btn.disabled = true; btn.textContent = "Memverifikasi...";
  try {
    await WhyaDB.verifyOtp(pending.email, code);
    await WhyaDB.registerUser(pending.name, pending.email, pending.password);
    try { sessionStorage.removeItem("whya_pending"); } catch(e) {}
    location.href = "/dashboard.html";
  } catch (e) {
    err.textContent = e.message || String(e);
    btn.disabled = false; btn.textContent = "Verifikasi & Buat Akun";
  }
}

async function doGoogle() {
  var err = document.getElementById("login-err") || document.getElementById("reg-err");
  try {
    var client = WhyaDB.client;
    if (!client) throw new Error("Supabase tidak siap");
    var redirectTo = location.origin + "/login.html";
    var { data, error } = await client.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: redirectTo, queryParams: { prompt: "select_account" } }
    });
    if (error) throw error;
    if (data && data.url) location.href = data.url;
  } catch (e) {
    if (err) err.textContent = (e && e.message) || String(e);
  }
}

// Google return
(async function(){
  try {
    if (!/access_token|code=/.test(location.hash + location.search)) return;
    var client = WhyaDB.client;
    if (!client) return;
    var { data } = await client.auth.getSession();
    var session = data && data.session;
    if (!session || !session.user) return;
    var fu = session.user;
    var email = (fu.email || "").toLowerCase();
    if (!email) return;
    var meta = fu.user_metadata || {};
    var name = meta.full_name || meta.name || email.split("@")[0];
    var id = emailToId(email);
    // upsert user
    var existing = await client.from("users").select("*").eq("id", id).maybeSingle();
    var user;
    if (existing.data) {
      user = {
        id: existing.data.id,
        publicId: existing.data.public_id,
        name: existing.data.name || name,
        email: email,
        photoURL: meta.avatar_url || existing.data.photo_url,
        role: existing.data.role || "user",
        authProvider: "google"
      };
    } else {
      user = await WhyaDB.registerUser(name, email, "google_" + Math.random().toString(36).slice(2));
      user.authProvider = "google";
      try {
        await client.from("users").update({ auth_provider: "google", photo_url: meta.avatar_url || null }).eq("id", user.id);
      } catch(e) {}
    }
    localStorage.setItem("wg_user", JSON.stringify(user));
    localStorage.setItem("currentUser", JSON.stringify(user));
    localStorage.setItem("wa_user_" + user.id, JSON.stringify(user));
    localStorage.setItem("wa_current_id", user.id);
    location.href = "/dashboard.html";
  } catch(e) { console.warn(e); }
})();

// sudah login?
(function(){
  try {
    var raw = localStorage.getItem("wg_user") || localStorage.getItem("currentUser");
    if (raw) {
      var u = JSON.parse(raw);
      if (u && (u.id || u.email)) {
        // tetap di login jika user buka /login sengaja
      }
    }
  } catch(e) {}
})();
</script>
</body>
</html>
